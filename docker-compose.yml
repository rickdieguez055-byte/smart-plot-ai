version: '3.8'

services:
  ai-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smartplot-ai-service
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - DEBUG=false
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '2.0'
        reservations:
          memory: 512M

  gateway:
    build:
      context: .
      dockerfile: node-gateway/Dockerfile
    container_name: smartplot-gateway
    restart: unless-stopped
    depends_on:
      ai-service:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - AI_SERVICE_URL=http://ai-service:8000
      - AI_SERVICE_TIMEOUT_MS=45000
      - CORS_ORIGIN=*
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
